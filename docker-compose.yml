version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farewell_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://farewell_user:farewell_pass@db:5432/farewell_db
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=farewell2026
      - SECRET_KEY=farewell-secret-key-production-replace-me
      - SIMILARITY_THRESHOLD=0.38
    volumes:
      - ./backend/storage:/app/backend/storage
      - ./backend/models:/app/backend/models
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: farewell_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: farewell_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: farewell_user
      POSTGRES_PASSWORD: farewell_pass
      POSTGRES_DB: farewell_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farewell_user -d farewell_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
